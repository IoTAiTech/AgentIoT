[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentiot-greenovax"
version = "0.157.10"
description = "Independent AgentIoT Dashboard prototype. Prepared for GreeNovaX by IoT-AI.Tech."
readme = "README.en.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.138.1",
  "starlette==1.3.1",
  "uvicorn[standard]==0.49.0",
  "pydantic==2.13.4",
  "PyJWT[crypto]==2.13.0",
  "cryptography==50.0.0",
  "gmqtt==0.7.0"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10"
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentiot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
