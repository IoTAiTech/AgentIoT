events {}

http {
  log_format agentiot_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
  access_log /dev/stdout agentiot_safe;
  error_log /dev/stderr warn;

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    error_page 497 =400 @https_required;

    location @https_required {
      default_type application/json;
      return 400 '{"detail":"HTTPS required"}';
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
      proxy_pass http://agentiot-app:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
