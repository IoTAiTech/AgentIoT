# SPDX-License-Identifier: MIT
name: public-clean

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if private documents or sensitive literals are present
        run: python3 tools/scan_public_github_tree.py .
      - name: Unit tests for the publication gate
        run: PYTHONPATH=src python3 -m pytest tests/test_public_github_publication.py
